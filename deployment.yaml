apiVersion: apps/v1
kind: Deployment

metadata:
  name: node-app-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: node-app

  template:
    metadata:
      labels:
        app: node-app

    spec:
      containers:
      - name: node-app

        image: docker-k8s-project:v1

        imagePullPolicy: Never

        ports:
        - containerPort: 3000

